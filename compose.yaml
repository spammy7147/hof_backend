services:
  hof-backend:
    build: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-org.postgresql.Driver}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:?SPRING_KAFKA_BOOTSTRAP_SERVERS is required}
      HOF_AUTH_JWT_SECRET: ${HOF_AUTH_JWT_SECRET:?HOF_AUTH_JWT_SECRET is required}
      HOF_CREDENTIAL_ENCRYPTION_KEY: ${HOF_CREDENTIAL_ENCRYPTION_KEY:?HOF_CREDENTIAL_ENCRYPTION_KEY is required}
      HOF_COOKIE_ENCRYPTION_KEY: ${HOF_COOKIE_ENCRYPTION_KEY:?HOF_COOKIE_ENCRYPTION_KEY is required}
      HOF_AUTH_REQUIRE_HTTPS: ${HOF_AUTH_REQUIRE_HTTPS:-true}
      HOF_AUTH_REFRESH_COOKIE_SECURE: ${HOF_AUTH_REFRESH_COOKIE_SECURE:-true}
      HOF_AUTH_ALLOWED_ORIGINS: ${HOF_AUTH_ALLOWED_ORIGINS:?HOF_AUTH_ALLOWED_ORIGINS is required}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - captcha-images:/var/lib/hof/captcha
      - ${FIREBASE_SERVICE_ACCOUNT_PATH:-./secrets/firebase-service-account.json}:/run/secrets/firebase-service-account.json:ro
    ports:
      - "8080:8080"

volumes:
  captcha-images:
