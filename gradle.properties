# Reuse successful task outputs and incremental Kotlin compilation state across
# Jenkins deployments. Jenkins keeps the workspace and Gradle user home intact.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx512m
kapt.incremental.apt=true
