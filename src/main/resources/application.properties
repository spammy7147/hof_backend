spring.application.name=hof
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Flyway owns schema changes; Hibernate only verifies entity mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
logging.level.app.spammy.hof=INFO
logging.pattern.level=%5p [req:%X{requestId:-}]
hof.auth.jwt-secret=${HOF_AUTH_JWT_SECRET}
hof.auth.credential-encryption-key=${HOF_CREDENTIAL_ENCRYPTION_KEY}
hof.auth.cookie-encryption-key=${HOF_COOKIE_ENCRYPTION_KEY}
hof.auth.access-token-ttl=30m
hof.auth.refresh-token-ttl=30d
hof.auth.refresh-reuse-grace=10s
hof.auth.rate-limit-window=${HOF_AUTH_RATE_LIMIT_WINDOW:1m}
hof.auth.login-rate-limit-per-ip=${HOF_AUTH_LOGIN_RATE_LIMIT_PER_IP:10}
hof.auth.login-rate-limit-per-id=${HOF_AUTH_LOGIN_RATE_LIMIT_PER_ID:5}
hof.auth.refresh-rate-limit-per-ip=${HOF_AUTH_REFRESH_RATE_LIMIT_PER_IP:60}
hof.auth.require-https=${HOF_AUTH_REQUIRE_HTTPS:false}
hof.auth.issuer=hof-backend
hof.auth.audience=hof-api
hof.auth.refresh-cookie-secure=${HOF_AUTH_REFRESH_COOKIE_SECURE:false}
hof.auth.allowed-origins=${HOF_AUTH_ALLOWED_ORIGINS}
hof.request.minimum-interval=${HOF_REQUEST_MINIMUM_INTERVAL:100ms}
hof.request.short-cooldown=${HOF_REQUEST_SHORT_COOLDOWN:30s}
hof.request.long-cooldown=${HOF_REQUEST_LONG_COOLDOWN:3m}
hof.request.long-cooldown-threshold=${HOF_REQUEST_LONG_COOLDOWN_THRESHOLD:3}
hof.automation-session.redis-enabled=${HOF_AUTOMATION_REDIS_ENABLED:false}
hof.automation-session.reconciliation-interval=${HOF_AUTOMATION_RECONCILIATION_INTERVAL:30m}
hof.automation-session.reconciliation-jitter=${HOF_AUTOMATION_RECONCILIATION_JITTER:2m}
hof.automation-session.due-poll-delay=${HOF_AUTOMATION_DUE_POLL_DELAY:5000}
