spring.application.name=hof
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:NONE}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Flyway owns schema changes; Hibernate only verifies entity mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
logging.level.app.spammy.hof=INFO
logging.pattern.level=%5p [req:%X{requestId:-}]
hof.auth.jwt-secret=${HOF_AUTH_JWT_SECRET}
hof.auth.credential-encryption-key=${HOF_CREDENTIAL_ENCRYPTION_KEY}
hof.auth.cookie-encryption-key=${HOF_COOKIE_ENCRYPTION_KEY}
hof.auth.access-token-ttl=30m
hof.auth.refresh-token-ttl=30d
hof.auth.refresh-reuse-grace=10s
hof.auth.rate-limit-window=${HOF_AUTH_RATE_LIMIT_WINDOW:1m}
hof.auth.login-rate-limit-per-id=${HOF_AUTH_LOGIN_RATE_LIMIT_PER_ID:5}
hof.auth.refresh-rate-limit-per-family=${HOF_AUTH_REFRESH_RATE_LIMIT_PER_FAMILY:10}
hof.auth.refresh-rate-limit-per-account=${HOF_AUTH_REFRESH_RATE_LIMIT_PER_ACCOUNT:30}
hof.auth.require-https=${HOF_AUTH_REQUIRE_HTTPS:false}
hof.auth.issuer=hof-backend
hof.auth.audience=hof-api
hof.auth.refresh-cookie-secure=${HOF_AUTH_REFRESH_COOKIE_SECURE:false}
hof.auth.allowed-origins=${HOF_AUTH_ALLOWED_ORIGINS}
hof.request.interactive-minimum-interval=${HOF_REQUEST_INTERACTIVE_MINIMUM_INTERVAL:250ms}
hof.request.automation-minimum-interval=${HOF_REQUEST_AUTOMATION_MINIMUM_INTERVAL:3s}
hof.request.short-cooldown=${HOF_REQUEST_SHORT_COOLDOWN:1s}
hof.request.long-cooldown=${HOF_REQUEST_LONG_COOLDOWN:60s}
hof.request.long-cooldown-threshold=${HOF_REQUEST_LONG_COOLDOWN_THRESHOLD:5}
hof.automation-session.redis-enabled=${HOF_AUTOMATION_REDIS_ENABLED:false}
hof.automation-session.reconciliation-interval=${HOF_AUTOMATION_RECONCILIATION_INTERVAL:30m}
hof.automation-session.reconciliation-jitter=${HOF_AUTOMATION_RECONCILIATION_JITTER:2m}
hof.automation-session.due-poll-delay=${HOF_AUTOMATION_DUE_POLL_DELAY:5000}
# SHADOW는 실제 evidence만 비교하고 runtime 전이나 HOF POST를 추가하지 않는다.
hof.automation-convergence.mode=${HOF_AUTOMATION_CONVERGENCE_MODE:SHADOW}
# 긴급 kill switch: false면 자동화 POST만 막고 상태 GET과 진단은 유지한다.
hof.automation-convergence.automation-posts-enabled=${HOF_AUTOMATION_POSTS_ENABLED:true}
hof.shop.collector-account-id=${HOF_SHOP_COLLECTOR_ACCOUNT_ID:0}
hof.shop.collector-cron=${HOF_SHOP_COLLECTOR_CRON:0 15 4 * * *}
hof.app-release.storage-root=${HOF_RELEASE_STORAGE_ROOT:/var/lib/hof/releases}
hof.app-release.publish-token=${HOF_RELEASE_PUBLISH_TOKEN:}
hof.captcha-auto-solve.enabled=${HOF_CAPTCHA_OCR_ENABLED:false}
hof.captcha-auto-solve.max-attempts=${HOF_CAPTCHA_AUTO_SOLVE_MAX_ATTEMPTS:3}
hof.captcha-auto-solve.max-ocr-failures=${HOF_CAPTCHA_OCR_MAX_FAILURES:3}
hof.captcha-auto-solve.base-url=${HOF_CAPTCHA_OCR_BASE_URL:}
hof.captcha-auto-solve.token=${HOF_CAPTCHA_OCR_TOKEN:}
hof.captcha-auto-solve.timeout=${HOF_CAPTCHA_OCR_TIMEOUT:10s}
hof.captcha-auto-solve.ocr-retry-delay=${HOF_CAPTCHA_OCR_RETRY_DELAY:500ms}
hof.captcha-auto-solve.allowed-characters=${HOF_CAPTCHA_OCR_ALLOWED_CHARACTERS:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789}
