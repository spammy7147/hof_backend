spring.application.name=hof
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/hof;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
logging.level.app.spammy.hof=INFO
logging.pattern.level=%5p [req:%X{requestId:-}]
hof.auth.jwt-secret=${HOF_AUTH_JWT_SECRET}
hof.auth.credential-encryption-key=${HOF_CREDENTIAL_ENCRYPTION_KEY}
hof.auth.access-token-ttl=30m
hof.auth.refresh-token-ttl=30d
hof.auth.refresh-reuse-grace=10s
hof.auth.issuer=hof-backend
hof.auth.audience=hof-api
hof.auth.refresh-cookie-secure=${HOF_AUTH_REFRESH_COOKIE_SECURE:false}
hof.auth.allowed-origins=${HOF_AUTH_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
